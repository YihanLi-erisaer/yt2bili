name: Desktop phase one
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Python dependencies and local media tools
        run: |
          python -m pip install -r requirements-desktop-lock.txt
          choco install ffmpeg --yes --no-progress
      - name: Backend regression
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -q
      - name: Frontend build and interactions
        working-directory: desktop
        run: |
          npm ci
          npm run test:launcher
          npm run build
          npm run test:e2e
      - name: Rust development build
        run: |
          rustup default stable
          cargo build --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Source and frozen worker dry run
        run: |
          python scripts/smoke_worker.py
          python scripts/build_worker.py
          python scripts/smoke_worker.py --frozen packaging/staging/yt2bili-worker/yt2bili-worker.exe
